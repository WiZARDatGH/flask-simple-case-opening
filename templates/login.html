<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giriş Yap</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .login-box {
            width: 360px;
            padding: 35px;

            background: #1e293b;
            border-radius: 14px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #475569;
            border-radius: 8px;

            background: #0f172a;
            color: white;

            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #3b82f6;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            padding: 10px;
            margin-bottom: 15px;

            background: #7f1d1d;
            border-radius: 8px;

            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Giriş Yap</h1>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="username">Kullanıcı adı</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Kullanıcı adınız"
                required
            >

            <label for="password">Şifre</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Şifreniz"
                required
            >

            <button type="submit">
                Giriş Yap
            </button>

        </form>

    </div>

</body>
</html>
