<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ana Sayfa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #0f172a;
            color: white;
        }

        nav {
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            padding: 9px 16px;

            color: white;
            text-decoration: none;

            background: #dc2626;
            border-radius: 7px;
        }

        .logout:hover {
            background: #b91c1c;
        }

        main {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .welcome {
            padding: 30px;

            background: #1e293b;
            border-radius: 14px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
        }

        .username {
            color: #3b82f6;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

            margin-top: 25px;
        }

        .card {
            padding: 25px;

            background: #1e293b;
            border-radius: 12px;

            border: 1px solid #334155;
        }

        .card h3 {
            margin-top: 0;
        }

        .card p {
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            My Flask App
        </div>

        <a class="logout" href="{{ url_for('logout') }}">
            Çıkış Yap
        </a>

    </nav>


    <main>

        <div class="welcome">

            <h1>
                Hoş geldin,
                <span class="username">
                    {{ username }}
                </span>
                👋
            </h1>

            <p>
                Başarıyla giriş yaptın.
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>Profil</h3>
                <p>
                    Kullanıcı bilgilerini burada görebilirsin.
                </p>
            </div>

            <div class="card">
                <h3>Ayarlar</h3>
                <p>
                    Hesap ayarlarını buradan yönetebilirsin.
                </p>
            </div>

            <div class="card">
                <h3>Dashboard</h3>
                <p>
                    Uygulamanın diğer özellikleri burada olabilir.
                </p>
            </div>

        </div>

    </main>

</body>
</html>
