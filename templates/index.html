<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ana Sayfa</title>

    <link rel='stylesheet' href='{{	url_for('static', filename='style/index.css')	}}'>
</head>

<body>

    <nav>

        <div class="logo">
            My Flask App
        </div>

        <a class="logout" href="{{ url_for('logout') }}">
            Çıkış Yap
        </a>

    </nav>


    <main>

        <div class="welcome">

            <h1>
                Hoş geldin,
                <span class="username">
                    {{ username }}
                </span>
                👋
            </h1>

            <p>
                Başarıyla giriş yaptın.
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>Profil</h3>
                <p>
                    Kullanıcı bilgilerini burada görebilirsin.
                </p>
            </div>

            <div class="card">
                <h3>Ayarlar</h3>
                <p>
                    Hesap ayarlarını buradan yönetebilirsin.
                </p>
            </div>

            <div class="card">
                <h3>Dashboard</h3>
                <p>
                    Uygulamanın diğer özellikleri burada olabilir.
                </p>
            </div>

        </div>

    </main>

</body>
</html>
